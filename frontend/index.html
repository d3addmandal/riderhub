<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1117" />
    <meta name="description" content="RiderHub — Your complete motorcycle riding companion" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>RiderHub</title>
    <style>
      /* Boot screen: painted by the browser the moment the HTML arrives, before the
         JavaScript bundle has downloaded. React replaces it on first render. The
         ground matches the manifest background_color, so on an installed app the
         system splash fades straight into this with no flash of white. */
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #0f1117; }
      .boot img { width: min(58vw, 240px); height: auto; animation: boot-pulse 1.6s ease-in-out infinite; }
      @keyframes boot-pulse { 0%, 100% { opacity: .85; transform: scale(.98); } 50% { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { .boot img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-hidden="true"><img src="/logo.webp" alt="" width="240" height="240" /></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
