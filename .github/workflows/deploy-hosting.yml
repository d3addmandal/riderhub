# Deploys the PWA to Firebase Hosting without the Firebase CLI on anyone's machine.
#
# Runs on every push to `main`, and on demand from GitHub → Actions → "Deploy to
# Firebase Hosting" → Run workflow. That button is the deploy: build, both release
# guards, then upload. The action reads firebase.json from the repository root, so the
# rewrites and headers ship exactly as tested locally.
#
# One-time setup, all in a browser — see DEPLOY.md "Deploying from the browser":
#   Secret    FIREBASE_SERVICE_ACCOUNT  — JSON key of a service account with the
#                                         Firebase Hosting Admin role
#   Variables VITE_API_URL, VITE_FIREBASE_*  — the build settings (public values)
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two pushes in quick succession should not race each other to the live site.
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      # Vite reads VITE_* from the process environment on top of frontend/.env.production.
      # Repository variables win when set; the committed file is the fallback. Either way
      # the build must not proceed with a placeholder API address or without the Firebase
      # web config — that produces a site that installs beautifully and cannot sign in.
      - name: Resolve build settings
        env:
          REPO_VARS: ${{ toJSON(vars) }}
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const fromVars = Object.fromEntries(Object.entries(JSON.parse(process.env.REPO_VARS || '{}'))
            .filter(([k, v]) => k.startsWith('VITE_') && v));
          const fromFile = {};
          for (const line of fs.readFileSync('frontend/.env.production', 'utf8').split('\n')) {
            const m = line.match(/^\s*(VITE_[A-Z_]+)\s*=\s*(.*?)\s*$/);
            if (m && m[2]) fromFile[m[1]] = m[2];
          }
          const merged = { ...fromFile, ...fromVars };
          const required = ['VITE_API_URL', 'VITE_FIREBASE_API_KEY', 'VITE_FIREBASE_AUTH_DOMAIN',
            'VITE_FIREBASE_PROJECT_ID', 'VITE_FIREBASE_MESSAGING_SENDER_ID', 'VITE_FIREBASE_APP_ID'];
          const missing = required.filter(k => !merged[k]);
          if (missing.length) {
            console.error(`Missing build settings: ${missing.join(', ')}\n` +
              'Add them as repository Variables (Settings → Secrets and variables → Actions → Variables) ' +
              'or commit them in frontend/.env.production. They are public values, not secrets.');
            process.exit(1);
          }
          if (!/^https:\/\//.test(merged.VITE_API_URL) || /YOUR-DOMAIN/.test(merged.VITE_API_URL)) {
            console.error(`VITE_API_URL is "${merged.VITE_API_URL}" — it must be the real https:// address of the API.`);
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, Object.entries(fromVars).map(([k, v]) => `${k}=${v}`).join('\n') + '\n');
          console.log('From repository variables:', Object.keys(fromVars).join(', ') || '(none)');
          console.log('From frontend/.env.production:', Object.keys(fromFile).filter(k => !fromVars[k]).join(', ') || '(none)');
          EOF

      - name: Build
        run: npm run build --prefix frontend

      # The same guards `npm run deploy:web` runs locally. A failure here stops the deploy.
      - name: Guard — no server secret in the bundle
        run: node tests/phase31.mjs .
      - name: Guard — the PWA is still installable
        run: node tests/phase36.mjs frontend/dist

      - name: Deploy to the live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: fly-with-pegasus
          channelId: live

      # The live site is the only place the headers can be checked (see DEPLOY.md).
      - name: Verify the live site
        run: node tests/phase37.mjs https://fly-with-pegasus.web.app
